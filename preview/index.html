function openWeek(id){const w=getWeek(id),u=getUnit(w),r=requests.find(r=>r.origin===id||r.target===id),matches=compatible(w);const eligible=w.original&&!w.traded&&w.state!=='blocked'&&w.state!=='available'&&!requests.some(r=>r.origin===id&&r.status!=='Concluído');openLayer(`<header class="drawer-head"><div><h2 id="layer-title">${u.name} · Tipologia ${u.type}</h2><p>${w.id} · ${range(w)}</p></div><button class="ghost square" data-action="close" aria-label="Fechar detalhes">${icon('close')}</button></header><div class="drawer-body">${badge(w)}<h3>Direito de uso</h3><dl class="info"><dt>Titular original</dt><dd>${escapeHtml(w.originalOwner)}</dd><dt>Direito de uso atual</dt><dd>${w.state==='available'||w.state==='reserved'?'Banco de semanas':escapeHtml(w.owner)}</dd><dt>Entrada</dt><dd>${full(w.start)} · ${u.kind==='Casa'?'quinta':'sexta'}-feira</dd><dt>Saída</dt><dd>${full(w.end)} · 7 noites</dd><dt>Cota vinculada</dt><dd>CT-${String(w.unit).padStart(3,'0')} · ${u.name}</dd></dl><h3>Situação operacional</h3><dl class="info"><dt>Intenção de uso</dt><dd>${w.state==='waiting'?'Quer trocar':w.state==='use'?'Vai usar':'Não informada'}</dd><dt>Disponibilidade</dt><dd>${w.state==='available'?'Efetivamente disponível':w.state==='reserved'?'Retida para negociação':'Fora do estoque disponível'}</dd><dt>Restrição</dt><dd>${w.state==='blocked'?'Inadimplência':'Nenhuma'}</dd><dt>Tipo de direito</dt><dd>${w.received?'Recebido em troca':w.original?'Semana original':'Estoque do banco'}</dd></dl>${w.received?'<div class="notice">Semana recebida em troca. Não elegível para uma nova troca.</div>':''}${w.state==='waiting'?'<div class="notice amber">Esta semana continua com o titular. Só entra no banco após a confirmação da troca.</div>':''}${w.state==='available'?`<h3>Pedidos compatíveis (${matches.length})</h3>${matches.length?matches.map((r,i)=>`<div class="option"><div><strong>${i+1}º · ${r.owner}</strong><p>Solicitado em ${full(r.created)} · ${r.id}</p></div><button class="link" data-request="${r.id}">Ver pedido</button></div>`).join(''):'<p class="muted small">Nenhum pedido aberto para esta semana.</p>'}`:''}<h3>Histórico recente</h3><div class="timeline">${w.history.length?w.history.map(h=>`<p><time>29/09/2026 · Paula Silva</time>${h}</p>`).join(''):'<p><time>10/09/2026 · Importação de demonstração</time>Semana cadastrada na base inicial.</p>'}</div></div><footer class="drawer-foot"><button data-action="close">Fechar</button>${r?`<button class="primary" data-request="${r.id}">Abrir pedido ${icon('right')}</button>`:eligible?`<button class="primary" data-origin="${id}">Criar pedido ${icon('plus')}</button>`:w.state==='available'?'<button class="primary" data-nav="requests">Consultar pedidos</button>':''}</footer>`)}
function renderBank(){renderCalendar()}
function renderRequests(){const list=[...requests].sort((a,b)=>a.created.localeCompare(b.created));$('#app').innerHTML=heading('Pedidos de troca','Prioridade pela data da solicitação original do titular.')+`<section class="surface"><div class="toolbar"><strong>${list.filter(r=>r.status!=='Concluído').length} pedidos abertos</strong><span class="muted small">A falta de resposta não altera a prioridade.</span></div><div class="table-wrap"><table><thead><tr><th>Pedido / titular</th><th>Solicitação original</th><th>Semana de origem</th><th>Procura</th><th>Situação</th><th></th></tr></thead><tbody>${list.map(r=>`<tr><td><strong>${escapeHtml(r.owner)}</strong><p>${r.id}</p></td><td>${full(r.created)}</td><td>${range(getWeek(r.origin))}<p>${getUnit(getWeek(r.origin)).name}</p></td><td>${r.desired.map(d=>full(d)).join('<br>')}<p>Check-in das opções desejadas</p></td><td><span class="badge ${r.status==='Concluído'?'available':r.expired?'waiting':r.target?'reserved':'use'}">${r.status==='Aberto'?(options(r).length?`${options(r).length} opção disponível`:'Aguardando oportunidade'):r.status}</span></td><td><button data-request="${r.id}">Abrir ${icon('right')}</button></td></tr>`).join('')}</tbody></table></div></section>`}
function renderOwners(){const owners=[...new Set(weeks.map(w=>w.originalOwner))];$('#app').innerHTML=heading('Proprietários','Titulares, cotas vinculadas e semanas de uso.')+`<section class="surface"><table><thead><tr><th>Titular</th><th>Cota / unidade</th><th>Pedidos abertos</th><th></th></tr></thead><tbody>${owners.map(name=>{const w=weeks.find(w=>w.originalOwner===name);return `<tr><td><strong>${name}</strong></td><td>CT-${String(w.unit).padStart(3,'0')} · ${getUnit(w).name}</td><td>${requests.filter(r=>r.owner===name&&r.status!=='Concluído').length}</td><td><button data-owner="${escapeHtml(name)}">Ver semanas</button></td></tr>`}).join('')}</tbody></table></section>`}
let selectedOrigin='';
function renderNew(){const eligible=weeks.filter(w=>w.original&&!w.traded&&w.state!=='blocked'&&!['available','reserved'].includes(w.state)&&!requests.some(r=>r.origin===w.id&&r.status!=='Concluído'));$('#app').innerHTML=`<button class="ghost back" data-nav="calendar">${icon('left')} Voltar ao calendário</button>`+heading('Novo pedido de troca','A semana original permanece com o titular até a confirmação.',false)+`<form id="new-form" class="surface new-form"><div class="section"><h2>1. Titular e semana original</h2><div class="form-grid"><label class="form-label wide">Selecione uma semana elegível<select name="origin" required><option value="">Selecionar titular e semana</option>${eligible.map(w=>`<option value="${w.id}" ${selectedOrigin===w.id?'selected':''}>${w.owner} · ${getUnit(w).name} · ${range(w)}</option>`).join('')}</select></label><label class="form-label">Data do pedido original<input type="date" name="created" max="2026-09-29" required value="2026-09-29"></label><div class="muted small" style="align-self:center;line-height:1.7">Esta data define a prioridade na fila, mesmo quando o cadastro é feito depois.</div></div></div><div class="section"><h2>2. Semanas desejadas</h2><p class="muted small" style="margin-top:10px">Informe entradas exatas. Quinta-feira para casas ou sexta-feira para flats; saída após sete noites.</p><div id="alternatives"><div class="form-grid"><label class="form-label">Primeira opção · check-in<input type="date" name="desired" required value="2027-04-16"></label></div></div><button type="button" data-action="alternative">${icon('plus')} Adicionar alternativa</button><label class="form-label" style="margin-top:22px">Observações<textarea name="notes" rows="3" placeholder="Informações úteis para o atendimento"></textarea></label></div><div class="footer-actions"><button type="button" data-nav="calendar">Cancelar</button><button class="primary" type="submit">Criar pedido e buscar opções ${icon('right')}</button></div></form>`}
function openRequest(id){activeRequest=id;showView('negotiation')}
function renderNegotiation(){const r=requests.find(r=>r.id===activeRequest);if(!r){showView('requests');return}const o=getWeek(r.origin),t=r.target?getWeek(r.target):null,done=r.status==='Concluído',found=options(r);$('#app').innerHTML=`<button class="ghost back" data-nav="requests">${icon('left')} Voltar aos pedidos</button>`+heading(`${r.id} · ${escapeHtml(r.owner)}`,'Confira as semanas e registre o aceite antes de concluir.',false)+`<div class="neg-grid"><div class="surface"><section class="section"><div class="actions" style="justify-content:space-between"><h2>Movimentação da troca</h2><span class="badge ${done?'available':r.expired?'waiting':'reserved'}">${r.status}</span></div><div class="exchange"><div class="exchange-side"><div class="direction">Semana original · ${escapeHtml(r.owner)}</div><h3>${short(o.start)} — ${short(o.end)}</h3><p>${o.start.slice(0,4)} · ${getUnit(o).name} · Tipologia ${getUnit(o).type}</p><p>${o.id}</p><div class="destination">${done?'Entrou':'Entra'} no banco de semanas</div></div>${icon('arrow')}<div class="exchange-side"><div class="direction">${done?'Semana recebida':'Semana de destino · Banco'}</div>${t?`<h3>${short(t.start)} — ${short(t.end)}</h3><p>${t.start.slice(0,4)} · ${getUnit(t).name} · Tipologia ${getUnit(t).type}</p><p>${t.id}</p><div class="destination">${done?'Atribuída':'Vai'} para ${escapeHtml(r.owner)}</div>`:'<h3>Selecionar uma opção</h3><p>Consulte as semanas disponíveis abaixo.</p>'}</div></div><div class="steps"><div class="step done"><strong>1. Pedido registrado</strong>${full(r.created)}</div><div class="step ${t?'done':''}"><strong>2. Semana reservada</strong>${t?t.id:'A selecionar'}</div><div class="step ${r.evidence?'done':''}"><strong>3. Aceite registrado</strong>${r.evidence?'Evidência anexada':'WhatsApp'}</div><div class="step ${done?'done':''}"><strong>4. Troca concluída</strong>${done?'Confirmada':'Revisão final'}</div></div></section>${done?'<section class="section"><div class="notice green">Troca concluída na demonstração. O banco recebeu a semana original e o titular recebeu a semana de destino. Consulte o calendário para ver a movimentação.</div><button data-nav="calendar">Ver no calendário</button></section>':!t?`<section class="section"><h2>Opções disponíveis (${found.length})</h2>${found.length?found.map(w=>{const first=compatible(w)[0],priority=first?.id===r.id;return `<div class="option"><div style="flex:1"><strong>${range(w)} · ${getUnit(w).name}</strong><p>Tipologia ${getUnit(w).type} · ${priority?'Este pedido é o primeiro da fila':`Prioridade de ${escapeHtml(first?.owner||'outro pedido')}`}</p></div><button data-reserve="${w.id}" class="${priority?'primary':''}" ${priority?'':'disabled'}>Reservar</button></div>`}).join(''):'<div class="notice">Nenhuma opção disponível neste momento. O pedido permanece aguardando oportunidade.</div>'}</section>`:`<section class="section"><h2>Contato e confirmação</h2>${r.expired?'<div class="notice amber"><strong>48h encerradas — ação do operador necessária</strong><br>A semana continua reservada. Liberar a reserva mantém o pedido aberto e preserva a data original.</div>':r.contact?'<div class="notice"><strong>Aguardando aceite · reserva de 48h corridas</strong><br>Contato registrado em 29/09/2026, 12h. Prazo: 01/10/2026, 12h (UTC, relógio da demonstração).</div>':'<div class="notice">Registre o envio da oferta pelo WhatsApp. Nesta prévia, esse registro inicia as 48h; o marco inicial ainda precisa de validação operacional.</div>'}<div class="actions">${!r.contact?`<button data-action="contact">${icon('check')} Registrar contato e verificar 90 dias</button>`:''}</div><div class="file"><strong class="small">Comprovante do aceite · WhatsApp</strong><p>Anexe um print ou arquivo da conversa. Nesta prévia, o arquivo permanece apenas no navegador.</p><input type="file" id="evidence" accept="image/png,image/jpeg,image/webp,application/pdf" aria-label="Anexar aceite de WhatsApp" ${!r.contact?'disabled':''}><p id="file-name">${r.evidence?escapeHtml(r.evidence):'Nenhum comprovante selecionado.'}</p></div></section>`}${!done&&t?`<footer class="footer-actions"><button data-action="release" class="danger">Liberar reserva</button><button data-action="review" class="primary" ${!r.contact||!r.evidence?'disabled':''}>Revisar e confirmar ${icon('right')}</button></footer>`:''}</div><aside class="surface" style="align-self:start"><div class="aside-section"><h3>Dados do pedido</h3><dl class="info"><dt>Titular</dt><dd>${escapeHtml(r.owner)}</dd><dt>Pedido original</dt><dd>${full(r.created)}</dd><dt>Responsável</dt><dd>Paula Silva</dd><dt>Semana original</dt><dd>${o.id}</dd></dl><div class="notice">${r.contact?'Antecedência verificada no contato.':'Antecedência mínima: 90 dias da semana original, verificada no contato.'}</div>${r.notes?`<p><strong>Observações</strong><br>${escapeHtml(r.notes)}</p>`:''}<h3>Histórico</h3><div class="timeline"><p><time>${full(r.created)}</time>Solicitação original registrada.</p>${t?`<p><time>${r.expired?'26/09/2026':'29/09/2026'}</time>Paula reservou ${t.id}.</p>`:''}${r.contact?'<p><time>Contato registrado</time>Oferta enviada pelo WhatsApp.</p>':''}${done?'<p><time>29/09/2026</time>Troca confirmada por Paula.</p>':''}</div></div></aside></div><p class="status-footer">Simulação em memória · Nenhuma alteração em direitos de uso reais</p>`}
function reserve(id){const r=requests.find(r=>r.id===activeRequest),w=getWeek(id);if(w.state!=='available'||compatible(w)[0]?.id!==r.id){toast('A disponibilidade ou a prioridade mudou. Consulte novamente.');render();return}w.state='reserved';w.history.push(`Reservada para ${r.id}.`);r.target=id;r.status='Em negociação';r.expired=false;renderNegotiation();toast('Semana reservada para este pedido.')}
function release(){const r=requests.find(r=>r.id===activeRequest);openLayer(`<h2 id="layer-title">Liberar a semana reservada?</h2><p>A semana volta ao banco. O pedido de ${escapeHtml(r.owner)} continua aberto, mantendo a prioridade de ${full(r.created)}.</p><div class="actions"><button data-action="close">Voltar</button><button class="danger" data-action="release-confirm">Liberar reserva</button></div>`,true)}
function review(){const r=requests.find(r=>r.id===activeRequest),o=getWeek(r.origin),t=getWeek(r.target);if(!r.contact||!r.evidence||t?.state!=='reserved')return;openLayer(`<h2 id="layer-title">Confirmar troca de semanas?</h2><p>Revise a movimentação para <strong>${escapeHtml(r.owner)}</strong>.</p><div class="notice"><strong>Entra no banco</strong><br>${getUnit(o).name} · ${range(o)}<br><br><strong>Passa para ${escapeHtml(r.owner)}</strong><br>${getUnit(t).name} · ${range(t)}</div><p>O aceite de WhatsApp está anexado. A semana recebida não poderá ser trocada novamente.</p><div class="actions"><button data-action="close">Voltar à revisão</button><button class="primary" data-action="confirm">${icon('check')} Confirmar troca</button></div>`,true)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.dataset.backdrop)closeLayer();return}if(b.dataset.nav){showView(b.dataset.nav);return}if(b.dataset.week){openWeek(b.dataset.week);return}if(b.dataset.request){openRequest(b.dataset.request);return}if(b.dataset.origin){selectedOrigin=b.dataset.origin;showView('new');return}if(b.dataset.reserve){reserve(b.dataset.reserve);return}if(b.dataset.owner){const list=weeks.filter(w=>w.originalOwner===b.dataset.owner||w.owner===b.dataset.owner);openLayer(`<header class="drawer-head"><h2 id="layer-title">${escapeHtml(b.dataset.owner)}</h2><button data-action="close" aria-label="Fechar">${icon('close')}</button></header><div class="drawer-body"><p class="muted small">Semanas ilustrativas para validação do layout.</p>${list.map(w=>`<div class="option"><div><strong>${range(w)}</strong><p>${getUnit(w).name} · ${labels[w.state]}</p></div><button data-week="${w.id}">Ver</button></div>`).join('')}</div>`);return}const a=b.dataset.action,r=requests.find(r=>r.id===activeRequest);if(a==='close')closeLayer();if(a==='new'){selectedOrigin='';showView('new')}if(a==='prev'||a==='next'){const d=new Date(Date.UTC(year,month+(a==='next'?1:-1),1));month=d.getUTCMonth();year=d.getUTCFullYear();renderGrid()}if(a==='reset-month'){month=3;year=2027;renderGrid()}if(a==='alternative')$('#alternatives').insertAdjacentHTML('beforeend','<div class="form-grid"><label class="form-label">Alternativa · check-in<input type="date" name="desired" required></label><button type="button" data-action="remove-alternative" style="align-self:end">Remover alternativa</button></div>');if(a==='remove-alternative')b.parentElement.remove();if(a==='contact'){const days=(date(getWeek(r.origin).start)-date('2026-09-29'))/86400000;if(days<90){toast('A semana original não atende à antecedência de 90 dias.');return}r.contact=true;renderNegotiation();toast('Contato registrado. Antecedência de 90 dias verificada.')}if(a==='release')release();if(a==='release-confirm'){const w=getWeek(r.target);w.state='available';w.history.push(`Reserva de ${r.id} liberada manualmente.`);r.target=null;r.status='Aberto';r.contact=false;r.evidence='';r.expired=false;closeLayer();renderNegotiation();toast('Reserva liberada. Prioridade do pedido preservada.')}if(a==='review')review();if(a==='confirm'){const o=getWeek(r.origin),t=getWeek(r.target);if(!r.evidence||!r.contact||t?.state!=='reserved'||o.state==='blocked'||o.traded){closeLayer();toast('As condições da troca mudaram. Revise o pedido.');return}o.state='available';o.original=false;o.traded=true;o.history.push(`Entrou no banco pela troca ${r.id}.`);t.state='use';t.owner=r.owner;t.received=true;t.original=false;t.history.push(`Direito de uso atribuído a ${escapeHtml(r.owner)} por ${r.id}.`);r.status='Concluído';r.expired=false;closeLayer();renderNegotiation();toast('Troca concluída na simulação. Estoque atualizado.')}});
document.addEventListener('change',e=>{if(e.target.id==='kind-filter'){filters.kind=e.target.value;renderUnitFilter();renderGrid()}if(e.target.id==='unit-filter'){filters.unit=e.target.value;renderGrid()}if(e.target.id==='state-filter'){filters.state=e.target.value;renderGrid()}if(e.target.id==='only-available'){filters.only=e.target.checked;renderGrid()}if(e.target.id==='evidence'){const file=e.target.files[0],r=requests.find(r=>r.id===activeRequest);if(file&&!['image/png','image/jpeg','image/webp','application/pdf'].includes(file.type)){e.target.value='';r.evidence='';toast('Selecione uma imagem PNG, JPEG, WebP ou um PDF.')}else r.evidence=file?.name||'';$('#file-name').textContent=r.evidence||'Nenhum comprovante selecionado.';$('[data-action=review]').disabled=!r.contact||!r.evidence}});
document.addEventListener('input',e=>{if(e.target.id==='calendar-search'){filters.q=e.target.value;renderGrid()}});
document.addEventListener('submit',e=>{if(e.target.id!=='new-form')return;e.preventDefault();const f=new FormData(e.target),o=getWeek(f.get('origin')),desired=[...new Set(f.getAll('desired').filter(Boolean))];if(desired.some(s=>![4,5].includes(date(s).getUTCDay()))){toast('Escolha uma quinta-feira (casa) ou sexta-feira (flat).');return}const id=`TR-${String(89+requests.length-3).padStart(4,'0')}`;requests.push({id,owner:o.owner,origin:o.id,desired,created:f.get('created'),notes:f.get('notes'),status:'Aberto',target:null,contact:false,evidence:''});o.state='waiting';o.history.push(`Pedido ${id} registrado; direito de uso preservado.`);openRequest(id);toast('Pedido criado com a data original de prioridade.')});
document.addEventListener('keydown',e=>{const dialog=$('#layers [role=dialog]');if(!dialog){if(e.key==='Escape'&&calendarFocus)setCalendarFocus(false);return}if(e.key==='Escape'){closeLayer();return}if(e.key==='Tab'){const focusable=[...dialog.querySelectorAll('button:not(:disabled),a,input:not(:disabled),select,textarea,[tabindex="0"]')];if(!focusable.length){e.preventDefault();return}const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===dialog)){e.preventDefault();first.focus()}}});
function openVisualExplorer(){
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  openLayer(`<header class="drawer-head"><div><h2 id="layer-title">Ícones e movimento</h2><p>Compare as opções diretamente nesta prévia.</p></div><button class="ghost square" data-action="close" aria-label="Fechar exploração">${icon('close')}</button></header>
    <div class="drawer-body"><h3>Família dos ícones principais</h3><p class="muted">A seleção altera a navegação e os ícones do calendário.</p>
    ${[['lucide','Lucide · Linear','Padrão aprovado. Contornos limpos e discretos, com uma linguagem mais técnica.'],['phosphor','Phosphor · Duotone','Alternativa com preenchimento suave para comparação.']].map(([key,title,description])=>`<section class="visual-choice"><h3>${title}</h3><p>${description}</p><div class="icon-samples">${['calendar','bank','requests','users'].map(n=>icon(n,key)).join('')}</div><button data-icon-family="${key}" aria-pressed="${iconFamily===key}">${iconFamily===key?'Em uso:':'Experimentar'} ${title}</button></section>`).join('')}
    <h3>Movimento funcional</h3><p class="muted">Drawer: entrada lateral de 220 ms. Modal e mensagens: aparição suave de 180 ms. Botões: resposta de cor em 140 ms.</p>
    <label class="motion-control"><input id="motion-toggle" type="checkbox" ${document.body.dataset.motion!=='off'?'checked':''} ${reduced?'disabled':''}><span>Ativar animações curtas<small>${reduced?'Seu sistema solicita movimento reduzido. As animações estão desativadas.':'A preferência de movimento reduzido do sistema é respeitada.'}</small></span></label>
    <button data-visual-action="replay">${icon('arrow')} Repetir abertura do painel</button>
    <h3>Referências consultadas</h3><div class="source-links"><a href="https://beui.dev/docs/motion-patterns" target="_blank" rel="noopener noreferrer">beUI · movimento</a><a href="https://shadcndashboard.com/templates" target="_blank" rel="noopener noreferrer">Shadcn · painéis</a><a href="https://lucide.dev/" target="_blank" rel="noopener noreferrer">Lucide · ISC</a><a href="https://phosphoricons.com/" target="_blank" rel="noopener noreferrer">Phosphor · MIT</a></div>
    </div><footer class="drawer-foot"><button class="primary" data-action="close">Voltar à prévia</button></footer>`);
}
document.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  if(button.hasAttribute('data-calendar-focus'))setCalendarFocus(!calendarFocus);
  if(button.dataset.visualAction==='open'||button.dataset.visualAction==='replay')openVisualExplorer();
  if(button.dataset.iconFamily){
    iconFamily=button.dataset.iconFamily;nav();
    if(view==='calendar'||view==='bank'){
      const scroll=$('.scroll'),left=scroll.scrollLeft,top=scroll.scrollTop;
      renderGrid();scroll.scrollLeft=left;scroll.scrollTop=top;
      $('.legend').innerHTML=calendarLegend();
    }
    document.querySelectorAll('[data-icon-family]').forEach(b=>{
      const title=b.dataset.iconFamily==='phosphor'?'Phosphor · Duotone':'Lucide · Linear';
      b.setAttribute('aria-pressed',String(b.dataset.iconFamily===iconFamily));
      b.textContent=`${b.dataset.iconFamily===iconFamily?'Em uso:':'Experimentar'} ${title}`;
    });
  }
});
document.addEventListener('change',e=>{if(e.target.id==='motion-toggle')document.body.dataset.motion=e.target.checked?'on':'off';if(e.target.id==='type-filter'){filters.type=e.target.value;renderGrid()}});
$('.nav-footer').insertAdjacentHTML('afterbegin',`<button class="explore-trigger" data-visual-action="open" aria-label="Explorar ícones e movimento">${icon('sliders')}<span>Ícones e movimento</span></button>`);
render();
</script>
