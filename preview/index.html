function openObservationDialog(){
  const r=requests.find(item=>item.id===activeRequest);if(!r||r.status==='Concluído')return;
  openLayer(`<h2 id="layer-title">Adicionar observação</h2><p>O registro ficará salvo somente na memória desta demonstração, com autor e data.</p><label class="observation-field">Observação<textarea id="observation-text" rows="4" maxlength="500" placeholder="Escreva uma informação útil para o atendimento"></textarea></label><div class="actions"><button data-action="close">Voltar</button><button class="primary" data-action="observation-save" disabled>Adicionar observação</button></div>`,true);
}
function saveObservation(){
  const r=requests.find(item=>item.id===activeRequest),field=$('#observation-text'),text=field?.value.trim();if(!r||r.status==='Concluído'||!text)return;
  ensureRequestCollections(r).observations.push({date:DEMO_TODAY,author:OPERATOR,text});closeLayer();renderExchangeDetail();toast('Observação adicionada ao histórico da troca.');
}
document.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button||view!=='calendar')return;
  if(button.dataset.calendarView){e.stopImmediatePropagation();setCalendarView(button.dataset.calendarView,calendarDate,'control');return}
  if(button.dataset.calendarMonth){e.stopImmediatePropagation();setCalendarView('month',button.dataset.calendarMonth,'context');return}
  if(button.dataset.calendarDrill&&button.dataset.calendarDate){e.stopImmediatePropagation();setCalendarView(button.dataset.calendarDrill,button.dataset.calendarDate,'context');return}
  if(button.dataset.calendarOverflow){e.stopImmediatePropagation();openCalendarOverflow(button.dataset.calendarOverflow);return}
  const action=button.dataset.action;
  if(action==='calendar-prev'||action==='calendar-next'){e.stopImmediatePropagation();moveCalendar(action==='calendar-next'?1:-1);return}
  if(action==='calendar-today'){e.stopImmediatePropagation();calendarDate=DEMO_TODAY;renderOperationalGrid()}
});
document.addEventListener('change',e=>{
  if(view!=='calendar'||!['kind-filter','type-filter','state-filter'].includes(e.target.id))return;
  e.stopImmediatePropagation();
  if(e.target.id==='kind-filter')filters.kind=e.target.value;
  if(e.target.id==='type-filter')filters.type=e.target.value;
  if(e.target.id==='state-filter')filters.state=e.target.value;
  renderOperationalGrid();
});
document.addEventListener('input',e=>{
  if(view!=='calendar'||e.target.id!=='calendar-search')return;
  e.stopImmediatePropagation();filters.q=e.target.value;renderOperationalGrid();
});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.dataset.backdrop)closeLayer();return}if(b.dataset.nav){showView(b.dataset.nav);return}if(b.dataset.week){openWeek(b.dataset.week);return}if(b.dataset.request){openRequest(b.dataset.request);return}if(b.dataset.origin){selectedOrigin=b.dataset.origin;showView('new');return}if(b.dataset.reserve){reserve(b.dataset.reserve);return}if(b.dataset.owner){const list=weeks.filter(w=>w.originalOwner===b.dataset.owner||w.owner===b.dataset.owner);openLayer(`<header class="drawer-head"><h2 id="layer-title">${escapeHtml(b.dataset.owner)}</h2><button data-action="close" aria-label="Fechar">${icon('close')}</button></header><div class="drawer-body"><p class="muted small">Semanas ilustrativas para validação do layout.</p>${list.map(w=>`<div class="option"><div><strong>${range(w)}</strong><p>${getUnit(w).name} · ${labels[w.state]}</p></div><button data-week="${w.id}">Ver</button></div>`).join('')}</div>`);return}const a=b.dataset.action,r=requests.find(r=>r.id===activeRequest);if(a==='close')closeLayer();if(a==='new'){selectedOrigin='';showView('new')}if(a==='prev'||a==='next'){const d=new Date(Date.UTC(year,month+(a==='next'?1:-1),1));month=d.getUTCMonth();year=d.getUTCFullYear();renderGrid()}if(a==='reset-month'){month=3;year=2027;renderGrid()}if(a==='alternative')$('#alternatives').insertAdjacentHTML('beforeend','<div class="form-grid"><label class="form-label">Alternativa · check-in<input type="date" name="desired" required></label><button type="button" data-action="remove-alternative" style="align-self:end">Remover alternativa</button></div>');if(a==='remove-alternative')b.parentElement.remove();if(a==='contact'){const days=(date(getWeek(r.origin).start)-date('2026-09-29'))/86400000;if(days<90){toast('A semana original não atende à antecedência de 90 dias.');return}r.contact=true;renderNegotiation();toast('Contato registrado. Antecedência de 90 dias verificada.')}if(a==='release')release();if(a==='release-confirm'){const w=getWeek(r.target);w.state='available';w.history.push(`Reserva de ${r.id} liberada manualmente.`);r.target=null;r.status='Aberto';r.contact=false;r.evidence='';r.expired=false;closeLayer();renderNegotiation();toast('Reserva liberada. Prioridade do pedido preservada.')}if(a==='review')review();if(a==='confirm'){const o=getWeek(r.origin),t=getWeek(r.target);if(!r.evidence||!r.contact||t?.state!=='reserved'||o.state==='blocked'||o.traded){closeLayer();toast('As condições da troca mudaram. Revise o pedido.');return}o.state='available';o.original=false;o.traded=true;o.history.push(`Entrou no banco pela troca ${r.id}.`);t.state='use';t.owner=r.owner;t.received=true;t.original=false;t.history.push(`Direito de uso atribuído a ${escapeHtml(r.owner)} por ${r.id}.`);r.status='Concluído';r.expired=false;closeLayer();renderNegotiation();toast('Troca concluída na simulação. Estoque atualizado.')}});
document.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  const action=button.dataset.action;
  if(action==='exchange-back')showView(exchangeReturnView);
  if(action==='reserve-start')openReserveDialog(button.dataset.targetWeek);
  if(action==='reserve-confirm')confirmReserve(button.dataset.targetWeek);
  if(action==='contact-start')openContactDialog();
  if(action==='contact-confirm')confirmContact();
  if(action==='release-start')openReleaseDialog();
  if(action==='release-option-confirm')confirmRelease();
  if(action==='review-start')openReviewDialog();
  if(action==='exchange-final-confirm')confirmExchange();
  if(action==='observation-start')openObservationDialog();
  if(action==='observation-save')saveObservation();
});
document.addEventListener('change',e=>{
  if(e.target.id==='kind-filter'){filters.kind=e.target.value;renderUnitFilter();renderGrid()}
  if(e.target.id==='unit-filter'){filters.unit=e.target.value;renderGrid()}
  if(e.target.id==='state-filter'){filters.state=e.target.value;renderGrid()}
  if(e.target.id==='only-available'){filters.only=e.target.checked;renderGrid()}
  if(e.target.id==='evidence'){
    const file=e.target.files[0],r=requests.find(item=>item.id===activeRequest),allowed=['image/png','image/jpeg','image/webp','application/pdf'];
    if(file&&!allowed.includes(file.type)){e.target.value='';r.evidence='';toast('Selecione uma imagem PNG, JPEG, WebP ou um PDF.')}
    else r.evidence=file?.name||'';
    $('#file-name').textContent=r.evidence||'Nenhum comprovante selecionado.';
    const reviewButton=$('[data-action=review-start]');if(reviewButton)reviewButton.disabled=!r.contact||!r.evidence;
  }
});
document.addEventListener('change',e=>{
  if(e.target.id!=='evidence')return;
  const file=e.target.files[0],r=requests.find(item=>item.id===activeRequest);
  if(!r||!file||!['image/png','image/jpeg','image/webp','application/pdf'].includes(file.type))return;
  if(!r.evidenceAt)recordRequestHistory(r,`Aceite de WhatsApp validado localmente: ${file.name}.`);
  r.evidenceAt=DEMO_TODAY;
  const stages=document.querySelectorAll('.exchange-stage');stages[2]?.classList.add('completed');stages[2]?.classList.remove('active');stages[2]?.querySelector('span')?.replaceChildren('WhatsApp validado');stages[3]?.classList.add('active');
  const timeline=$('.request-timeline');if(timeline)timeline.innerHTML=renderRequestTimeline(r);
  toast('Comprovante de aceite validado localmente.');
});
document.addEventListener('input',e=>{if(e.target.id==='calendar-search'){filters.q=e.target.value;renderGrid()}if(e.target.id==='dashboard-search'){dashboardQuery=e.target.value;renderDashboardColumns()}});
document.addEventListener('input',e=>{if(e.target.id==='observation-text'){const save=$('[data-action=observation-save]');if(save)save.disabled=!e.target.value.trim()}});
document.addEventListener('submit',e=>{if(e.target.id!=='new-form')return;e.preventDefault();const f=new FormData(e.target),o=getWeek(f.get('origin')),desired=[...new Set(f.getAll('desired').filter(Boolean))];if(desired.some(s=>![4,5].includes(date(s).getUTCDay()))){toast('Escolha uma quinta-feira (casa) ou sexta-feira (flat).');return}const id=`TR-${String(89+requests.length-3).padStart(4,'0')}`;requests.push({id,owner:o.owner,origin:o.id,desired,created:f.get('created'),notes:f.get('notes'),status:'Aberto',target:null,contact:false,evidence:''});o.state='waiting';o.history.push(`Pedido ${id} registrado; direito de uso preservado.`);openRequest(id);toast('Pedido criado com a data original de prioridade.')});
document.addEventListener('keydown',e=>{const dialog=$('#layers [role=dialog]');if(!dialog){if(e.key==='Escape'&&calendarFocus)setCalendarFocus(false);return}if(e.key==='Escape'){closeLayer();return}if(e.key==='Tab'){const focusable=[...dialog.querySelectorAll('button:not(:disabled),a,input:not(:disabled),select,textarea,[tabindex="0"]')];if(!focusable.length){e.preventDefault();return}const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===dialog)){e.preventDefault();first.focus()}}});
function openVisualExplorer(){
  const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
  openLayer(`<header class="drawer-head"><div><h2 id="layer-title">Ícones e movimento</h2><p>Compare as opções diretamente nesta prévia.</p></div><button class="ghost square" data-action="close" aria-label="Fechar exploração">${icon('close')}</button></header>
    <div class="drawer-body"><h3>Família dos ícones principais</h3><p class="muted">A seleção altera a navegação e os ícones do calendário.</p>
    ${[['lucide','Lucide · Linear','Padrão aprovado. Contornos limpos e discretos, com uma linguagem mais técnica.'],['phosphor','Phosphor · Duotone','Alternativa com preenchimento suave para comparação.']].map(([key,title,description])=>`<section class="visual-choice"><h3>${title}</h3><p>${description}</p><div class="icon-samples">${['dashboard','calendar','bank','requests','users'].map(n=>icon(n,key)).join('')}</div><button data-icon-family="${key}" aria-pressed="${iconFamily===key}">${iconFamily===key?'Em uso:':'Experimentar'} ${title}</button></section>`).join('')}
    <h3>Movimento funcional</h3><p class="muted">Drawer: entrada lateral de 220 ms. Modal e mensagens: aparição suave de 180 ms. Botões: resposta de cor em 140 ms.</p>
    <label class="motion-control"><input id="motion-toggle" type="checkbox" ${document.body.dataset.motion!=='off'?'checked':''} ${reduced?'disabled':''}><span>Ativar animações curtas<small>${reduced?'Seu sistema solicita movimento reduzido. As animações estão desativadas.':'A preferência de movimento reduzido do sistema é respeitada.'}</small></span></label>
    <button data-visual-action="replay">${icon('arrow')} Repetir abertura do painel</button>
    <h3>Referências consultadas</h3><div class="source-links"><a href="https://beui.dev/docs/motion-patterns" target="_blank" rel="noopener noreferrer">beUI · movimento</a><a href="https://shadcndashboard.com/templates" target="_blank" rel="noopener noreferrer">Shadcn · painéis</a><a href="https://lucide.dev/" target="_blank" rel="noopener noreferrer">Lucide · ISC</a><a href="https://phosphoricons.com/" target="_blank" rel="noopener noreferrer">Phosphor · MIT</a></div>
    </div><footer class="drawer-foot"><button class="primary" data-action="close">Voltar à prévia</button></footer>`);
}
document.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  if(button.hasAttribute('data-calendar-focus'))setCalendarFocus(!calendarFocus);
  if(button.dataset.visualAction==='open'||button.dataset.visualAction==='replay')openVisualExplorer();
  if(button.dataset.iconFamily){
    iconFamily=button.dataset.iconFamily;nav();
    if(view==='calendar')renderOperationalGrid();
    if(view==='bank'){
      const scroll=$('.scroll'),left=scroll.scrollLeft,top=scroll.scrollTop;
      renderGrid();scroll.scrollLeft=left;scroll.scrollTop=top;
      $('.legend').innerHTML=calendarLegend();
    }
    document.querySelectorAll('[data-icon-family]').forEach(b=>{
      const title=b.dataset.iconFamily==='phosphor'?'Phosphor · Duotone':'Lucide · Linear';
      b.setAttribute('aria-pressed',String(b.dataset.iconFamily===iconFamily));
      b.textContent=`${b.dataset.iconFamily===iconFamily?'Em uso:':'Experimentar'} ${title}`;
    });
  }
});
document.addEventListener('change',e=>{if(e.target.id==='motion-toggle')document.body.dataset.motion=e.target.checked?'on':'off';if(e.target.id==='type-filter'){filters.type=e.target.value;renderGrid()}});
$('.nav-footer').insertAdjacentHTML('afterbegin',`<button class="explore-trigger" data-visual-action="open" aria-label="Explorar ícones e movimento">${icon('sliders')}<span>Ícones e movimento</span></button>`);
render();
</script>
