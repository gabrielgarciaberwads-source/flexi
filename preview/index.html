/* Task 4 system pass. Colors are functional interface values, not additions
   to the Ownerinc brand palette. */
:root{
  --canvas:#f6f5f2;--surface:#fff;--surface-subtle:#f8f7f4;--ink:#1d1d1b;
  --muted:#5c5b56;--line:#dedcd6;--line-strong:#c9c6be;
  --blue:#1558c0;--blue-hover:#10489d;--focus:#0d5bd7;
  --radius-sm:5px;--radius-md:8px;--radius-lg:12px;
  --space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;
  --shadow-layer:0 18px 48px #1d1d1b24;--z-topbar:10;--z-sidebar-backdrop:25;--z-sidebar:30;--z-layer:40;--z-dialog:50;--z-toast:60
}
html{font-family:Novelin,sans-serif;background:var(--canvas);overflow-x:clip}
body{min-width:0;background:var(--canvas);color:var(--ink);line-height:1.5;overflow-wrap:anywhere}
body.layer-open,body.sidebar-open{overflow:hidden}
button,input,select,textarea{font-family:inherit}
button,a,input,select,textarea{touch-action:manipulation}
button{min-height:44px;border-color:var(--line-strong);border-radius:var(--radius-sm);font-weight:700}
button:hover:not(:disabled){background:#f0efeb;border-color:#b8b5ad}
button:active:not(:disabled){transform:translateY(1px)}
button.primary{background:var(--blue);border-color:var(--blue);color:#fff}
button.primary:hover:not(:disabled){background:var(--blue-hover);border-color:var(--blue-hover)}
button.danger{background:#fff;color:#8f3040;border-color:#d8aeb6}
.link{min-height:44px;color:var(--blue)}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--focus);outline-offset:3px}
.field,select,input[type=date],input[type=file],textarea{min-height:44px;border-color:var(--line-strong);border-radius:var(--radius-sm);background:#fff;color:var(--ink)}
select{background-color:#fff;color:var(--ink)}
h1,h2,h3{color:var(--ink);text-wrap:balance}p{ text-wrap:pretty }
h1{font-weight:700;line-height:1.12}h2{line-height:1.2}h3{line-height:1.3}
.mono,.summary strong,.metric-card strong,.exchange-meta strong,time{font-variant-numeric:tabular-nums}
.visually-hidden{position:absolute!important;width:1px!important;height:1px!important;padding:0!important;margin:-1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;white-space:nowrap!important;border:0!important}
.skip-link{position:fixed;z-index:calc(var(--z-toast) + 1);top:10px;left:10px;transform:translateY(-150%);background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--radius-sm);font-weight:700}
.skip-link:focus{transform:translateY(0)}
.surface,.metric-card,.dashboard-panel,.exchange-meta{border-color:var(--line);border-radius:var(--radius-md)}
.topbar{position:sticky;top:0;z-index:var(--z-topbar);border-color:var(--line);min-width:0}
.topbar-context,.topbar-meta{min-width:0}.topbar-context #breadcrumb{color:#35342f;font-weight:700}
main,.content,.heading>div,.dashboard-tools,.calendar-commandbar,.calendar-filters,.exchange-detail-grid{min-width:0}
.content{width:100%}
.brand-logo{aspect-ratio:311/149;object-fit:contain}
.sidebar{z-index:var(--z-sidebar);border-color:var(--line);transition:transform var(--motion-panel) var(--ease-out),visibility 0s linear 0s}
.sidebar-brand-row{display:flex;align-items:flex-start;justify-content:space-between;gap:var(--space-3)}
.mobile-nav-toggle,.mobile-nav-close{display:none}
.sidebar-backdrop{display:none}
.nav button.active{background:var(--ink);color:#fff}.nav button:hover:not(.active){background:#f0efeb;color:var(--ink)}
.dashboard-list,.drawer-body,.dialog,.calendar-stage,.scroll,.table-wrap{overscroll-behavior:contain}
.dashboard-empty,.calendar-empty-state,.observation-empty,.empty{color:var(--muted);background:var(--surface-subtle);font-size:14px;line-height:1.55;text-align:center}
.badge{border:1px solid currentColor;font-weight:700;line-height:1.25}
.available,.week.available:hover{background:#e8f3ed;color:#205f43;border-left-color:#3d8462}
.use,.week.use:hover{background:#edf1f7;color:#475b78;border-left-color:#788da9}

function confirmReserve(){
  const snapshot=pendingExchangeConfirmation,r=requests.find(item=>item.id===snapshot?.requestId),o=r?getWeek(r.origin):null,w=getWeek(snapshot?.targetId);
  if(snapshot?.action!=='reserve'||!confirmationMatches(snapshot,r,o,w))return rejectExchangeConfirmation();
  const issue=reserveIssue(r,o,w);if(issue)return rejectExchangeConfirmation(issue);
  w.state='reserved';w.history.push(`Reservada para ${r.id}.`);r.target=w.id;r.status='Em negociação';r.expired=false;r.reservedPriorityTarget=w.id;r.reservedPriorityCreated=r.created;recordRequestHistory(r,`Opção ${w.id} reservada.`);finishExchangeLayer('[data-action="contact-start"]','Opção reservada para este pedido.');
}
function openContactDialog(){
  const r=requests.find(item=>item.id===activeRequest),o=r?getWeek(r.origin):null,t=r?.target?getWeek(r.target):null,issue=contactIssue(r,o,t,false);if(issue){toast(issue);renderExchangeDetail();return}
  const days=(date(o.start)-date(DEMO_TODAY))/86400000,html=`<h2 id="layer-title">Registrar contato?</h2><p>Confirme que a oferta foi enviada pelo WhatsApp. A semana original está a <strong>${days} dias</strong> e o mínimo exigido é 90 dias.</p><div class="actions"><button data-action="close">Voltar</button><button class="primary" data-action="contact-confirm">Confirmar contato</button></div>`;
  openExchangeConfirmation(confirmationSnapshot('contact',r,o,t),html);
}
function confirmContact(){
  const snapshot=pendingExchangeConfirmation,r=requests.find(item=>item.id===snapshot?.requestId),o=r?getWeek(r.origin):null,t=getWeek(snapshot?.targetId);
  if(snapshot?.action!=='contact'||!confirmationMatches(snapshot,r,o,t))return rejectExchangeConfirmation();
  const issue=contactIssue(r,o,t);if(issue)return rejectExchangeConfirmation(issue);
  r.contact=true;recordRequestHistory(r,'Contato registrado e antecedência de 90 dias verificada.');finishExchangeLayer('#evidence','Contato registrado. Antecedência de 90 dias verificada.');
}
function openReleaseDialog(){
  const r=requests.find(item=>item.id===activeRequest),o=r?getWeek(r.origin):null,w=r?.target?getWeek(r.target):null,issue=releaseIssue(r,o,w);if(issue){toast(issue);renderExchangeDetail();return}
  const html=`<h2 id="layer-title">Liberar a opção reservada?</h2><p>A opção ${w.id} volta ao banco. O pedido de ${escapeHtml(r.owner)} continua aberto e mantém a prioridade de ${full(r.created)}.</p><div class="actions"><button data-action="close">Voltar</button><button class="danger" data-action="release-option-confirm">Liberar reserva</button></div>`;
  openExchangeConfirmation(confirmationSnapshot('release',r,o,w),html);
}
function confirmRelease(){
  const snapshot=pendingExchangeConfirmation,r=requests.find(item=>item.id===snapshot?.requestId),o=r?getWeek(r.origin):null,w=getWeek(snapshot?.targetId);
  if(snapshot?.action!=='release'||!confirmationMatches(snapshot,r,o,w))return rejectExchangeConfirmation();
  const issue=releaseIssue(r,o,w);if(issue)return rejectExchangeConfirmation(issue);
  const releasedId=w.id;w.state='available';w.history.push(`Reserva de ${r.id} liberada manualmente.`);r.target=null;r.status='Aberto';r.contact=false;clearEvidence(r);r.expired=false;r.reservedPriorityTarget='';r.reservedPriorityCreated='';recordRequestHistory(r,`Reserva de ${releasedId} liberada manualmente; pedido mantido aberto.`);finishExchangeLayer('[data-action="reserve-start"]:not(:disabled)','Reserva liberada. Prioridade do pedido preservada.');
}
function openReviewDialog(){
  const r=requests.find(item=>item.id===activeRequest),o=r?getWeek(r.origin):null,t=r?.target?getWeek(r.target):null,issue=exchangeIssue(r,o,t);if(issue){toast(issue);renderExchangeDetail();return}
  const html=`<h2 id="layer-title">Confirmar troca de semanas?</h2><p>Revise a movimentação para <strong>${escapeHtml(r.owner)}</strong>.</p><div class="notice"><strong>Entra no banco</strong><br>${getUnit(o).name} · ${range(o)} · ${o.id}<br><br><strong>Passa para ${escapeHtml(r.owner)}</strong><br>${getUnit(t).name} · ${range(t)} · ${t.id}</div><p>O aceite de WhatsApp foi validado. A semana recebida não poderá ser trocada novamente.</p><div class="actions"><button data-action="close">Voltar à revisão</button><button class="primary" data-action="exchange-final-confirm">${icon('check')} Confirmar troca</button></div>`;
  openExchangeConfirmation(confirmationSnapshot('exchange',r,o,t),html);
}
function confirmExchange(){
  const snapshot=pendingExchangeConfirmation,r=requests.find(item=>item.id===snapshot?.requestId),o=r?getWeek(r.origin):null,t=getWeek(snapshot?.targetId);
  if(snapshot?.action!=='exchange'||!confirmationMatches(snapshot,r,o,t))return rejectExchangeConfirmation();
  const issue=exchangeIssue(r,o,t);if(issue)return rejectExchangeConfirmation(issue);
  o.state='available';o.original=false;o.traded=true;o.history.push(`Entrou no banco pela troca ${r.id}.`);t.state='use';t.owner=r.owner;t.received=true;t.original=false;t.history.push(`Direito de uso atribuído a ${r.owner} por ${r.id}.`);r.status='Concluído';r.expired=false;recordRequestHistory(r,'Troca confirmada; origem enviada ao banco e destino atribuído ao proprietário.');finishExchangeLayer('.exchange-readonly-nav button','Troca concluída na simulação. Estoque atualizado.');
}
function openObservationDialog(){
  const r=requests.find(item=>item.id===activeRequest);if(!r||r.status==='Concluído')return;
  openLayer(`<h2 id="layer-title">Adicionar observação</h2><p>O registro ficará salvo somente na memória desta demonstração, com autor e data.</p><label class="observation-field">Observação<textarea id="observation-text" name="observation" rows="4" maxlength="500" autocomplete="off" placeholder="Escreva uma informação útil para o atendimento…"></textarea></label><div class="actions"><button data-action="close">Voltar</button><button class="primary" data-action="observation-save" disabled>Adicionar observação</button></div>`,true);
}
function saveObservation(){
  const r=requests.find(item=>item.id===activeRequest),field=$('#observation-text'),text=field?.value.trim();if(!r||r.status==='Concluído'||!text)return;
  ensureRequestCollections(r).observations.push({date:DEMO_TODAY,author:OPERATOR,text});finishExchangeLayer('[data-action="observation-start"]','Observação adicionada ao histórico da troca.');
}
document.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button||view!=='calendar')return;
  if(button.dataset.calendarView){e.stopImmediatePropagation();setCalendarView(button.dataset.calendarView,calendarDate,'control');return}
  if(button.dataset.calendarMonth){e.stopImmediatePropagation();setCalendarView('month',button.dataset.calendarMonth,'context');return}
  if(button.dataset.calendarDrill&&button.dataset.calendarDate){e.stopImmediatePropagation();setCalendarView(button.dataset.calendarDrill,button.dataset.calendarDate,'context');return}
  if(button.dataset.calendarOverflow){e.stopImmediatePropagation();openCalendarOverflow(button.dataset.calendarOverflow);return}
  const action=button.dataset.action;
  if(action==='calendar-prev'||action==='calendar-next'){e.stopImmediatePropagation();moveCalendar(action==='calendar-next'?1:-1);return}
  if(action==='calendar-today'){e.stopImmediatePropagation();calendarDate=DEMO_TODAY;renderOperationalGrid()}
});
document.addEventListener('change',e=>{
  if(view!=='calendar'||!['kind-filter','type-filter','state-filter'].includes(e.target.id))return;
  e.stopImmediatePropagation();
  if(e.target.id==='kind-filter')filters.kind=e.target.value;
  if(e.target.id==='type-filter')filters.type=e.target.value;
  if(e.target.id==='state-filter')filters.state=e.target.value;
  renderOperationalGrid();
});
document.addEventListener('input',e=>{
  if(view!=='calendar'||e.target.id!=='calendar-search')return;
  e.stopImmediatePropagation();filters.q=e.target.value;renderOperationalGrid();
});
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b){if(e.target.dataset.backdrop)closeLayer();return}
  if(b.dataset.nav){showView(b.dataset.nav);return}
  if(b.dataset.week){openWeek(b.dataset.week);return}
  if(b.dataset.request){openRequest(b.dataset.request);return}
  if(b.dataset.origin){selectedOrigin=b.dataset.origin;showView('new');return}
  if(b.dataset.owner){const list=weeks.filter(w=>w.originalOwner===b.dataset.owner||w.owner===b.dataset.owner);openLayer(`<header class="drawer-head"><h2 id="layer-title">${escapeHtml(b.dataset.owner)}</h2><button data-action="close" aria-label="Fechar">${icon('close')}</button></header><div class="drawer-body"><p class="muted small">Semanas ilustrativas para validação do layout.</p>${list.map(w=>`<div class="option"><div><strong>${range(w)}</strong><p>${getUnit(w).name} · ${labels[w.state]}</p></div><button data-week="${w.id}">Ver</button></div>`).join('')}</div>`);return}
  const action=b.dataset.action;
  if(action==='mobile-nav-open')setMobileNavigation(true);
  if(action==='mobile-nav-close')setMobileNavigation(false);
  if(action==='close')closeLayer();
  if(action==='new'){selectedOrigin='';showView('new')}
  if(action==='prev'||action==='next'){const d=new Date(Date.UTC(year,month+(action==='next'?1:-1),1));month=d.getUTCMonth();year=d.getUTCFullYear();renderGrid()}
  if(action==='reset-month'){month=9;year=2026;renderGrid()}
  if(action==='alternative')$('#alternatives').insertAdjacentHTML('beforeend','<div class="form-grid"><label class="form-label">Alternativa · check-in<input type="date" name="desired" required></label><button type="button" data-action="remove-alternative" style="align-self:end">Remover alternativa</button></div>');
  if(action==='remove-alternative')b.parentElement.remove();
});
document.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  const action=button.dataset.action;
  if(action==='exchange-back')showView(exchangeReturnView);
  if(action==='reserve-start')openReserveDialog(button.dataset.targetWeek);
  if(action==='reserve-confirm')confirmReserve();
  if(action==='contact-start')openContactDialog();
  if(action==='contact-confirm')confirmContact();
  if(action==='release-start')openReleaseDialog();
  if(action==='release-option-confirm')confirmRelease();
  if(action==='review-start')openReviewDialog();
  if(action==='exchange-final-confirm')confirmExchange();
  if(action==='observation-start')openObservationDialog();
  if(action==='observation-save')saveObservation();
});
document.addEventListener('change',e=>{
  if(e.target.id==='kind-filter'){filters.kind=e.target.value;renderUnitFilter();renderGrid()}
  if(e.target.id==='unit-filter'){filters.unit=e.target.value;renderGrid()}
  if(e.target.id==='state-filter'){filters.state=e.target.value;renderGrid()}
  if(e.target.id==='only-available'){filters.only=e.target.checked;renderGrid()}
  if(e.target.id==='evidence'){
    const file=e.target.files[0],r=requests.find(item=>item.id===activeRequest);if(!r)return;
    clearEvidence(r);
    if(file&&!ALLOWED_EVIDENCE_TYPES.includes(file.type)){
      e.target.value='';renderExchangeDetail();focusRenderedTarget('#evidence');toast('Selecione uma imagem PNG, JPEG, WebP ou um PDF.');return;
    }
    if(file){r.evidence=file.name;r.evidenceAt=DEMO_TODAY;r.evidenceType=file.type;recordRequestHistory(r,`Aceite de WhatsApp validado localmente: ${file.name}.`,DEMO_TODAY,'evidence')}
    renderExchangeDetail();focusRenderedTarget('#evidence');toast(file?'Comprovante de aceite validado localmente.':'Comprovante removido.');
  }
});
document.addEventListener('input',e=>{if(e.target.id==='calendar-search'){filters.q=e.target.value;renderGrid()}if(e.target.id==='dashboard-search'){dashboardQuery=e.target.value;renderDashboardColumns()}});
document.addEventListener('input',e=>{if(e.target.id==='observation-text'){const save=$('[data-action=observation-save]');if(save)save.disabled=!e.target.value.trim()}});
document.addEventListener('submit',e=>{if(e.target.id!=='new-form')return;e.preventDefault();const f=new FormData(e.target),o=getWeek(f.get('origin')),desired=[...new Set(f.getAll('desired').filter(Boolean))];if(desired.some(s=>![4,5].includes(date(s).getUTCDay()))){toast('Escolha uma quinta-feira (casa) ou sexta-feira (flat).');return}const id=`TR-${String(89+requests.length-3).padStart(4,'0')}`;requests.push({id,owner:o.owner,origin:o.id,desired,created:f.get('created'),notes:f.get('notes'),status:'Aberto',target:null,contact:false,evidence:''});o.state='waiting';o.history.push(`Pedido ${id} registrado; direito de uso preservado.`);openRequest(id);toast('Pedido criado com a data original de prioridade.')});
document.addEventListener('keydown',e=>{
  const dialog=$('#layers [role=dialog]');
  if(dialog){
    if(e.key==='Escape'){e.preventDefault();closeLayer();return}
    if(e.key==='Tab'){const focusable=focusableElements(dialog);if(!focusable.length){e.preventDefault();dialog.focus();return}const first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&(document.activeElement===first||document.activeElement===dialog)){e.preventDefault();last.focus()}else if(!e.shiftKey&&(document.activeElement===last||document.activeElement===dialog)){e.preventDefault();first.focus()}}
    return;
  }
  if(sidebarOpen&&mobileNavigationQuery.matches){
    if(e.key==='Escape'){e.preventDefault();setMobileNavigation(false);return}
    if(e.key==='Tab'){const sidebar=$('#sidebar'),focusable=focusableElements(sidebar),first=focusable[0],last=focusable.at(-1);if(!first){e.preventDefault();return}if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}
    return;
  }
  if(e.key==='Escape'&&calendarFocus)setCalendarFocus(false);
});
document.addEventListener('click',e=>{
  const button=e.target.closest('button');if(!button)return;
  if(button.hasAttribute('data-calendar-focus'))setCalendarFocus(!calendarFocus);
});
document.addEventListener('change',e=>{if(e.target.id==='type-filter'&&view!=='calendar'){filters.type=e.target.value;renderGrid()}});
syncResponsiveNavigation();
render();
